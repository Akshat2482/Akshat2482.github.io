<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RoomSwitch — Threshold Control</title>
<style>
  :root {
    --bg: #06090c;
    --panel: #0c1218;
    --line: #1c2a33;
    --cyan: #4de3d4;
    --cyan-dim: #276a63;
    --amber: #e0a458;
    --text: #cfe7e3;
    --text-dim: #6c8a86;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    background:
      radial-gradient(ellipse at top, #0d1a1f 0%, var(--bg) 60%);
    color: var(--text);
    font-family: 'Consolas', 'SF Mono', 'Courier New', monospace;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
  }
  .panel {
    width: 100%;
    max-width: 420px;
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 4px;
    padding: 28px 28px 24px;
    position: relative;
  }
  .panel::before {
    content: "";
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 2px;
    background: linear-gradient(90deg, transparent, var(--cyan), transparent);
    opacity: .5;
  }
  h1 {
    font-size: 15px;
    font-weight: 600;
    letter-spacing: 1px;
    margin: 0 0 2px;
    color: var(--text);
  }
  .sub {
    font-size: 11px;
    color: var(--text-dim);
    margin-bottom: 22px;
  }
  .status-row {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 12px;
    color: var(--text-dim);
    margin-bottom: 22px;
    padding-bottom: 16px;
    border-bottom: 1px solid var(--line);
  }
  .dot {
    width: 7px; height: 7px;
    border-radius: 50%;
    background: #3a4a4a;
    box-shadow: none;
    transition: all .2s;
  }
  .dot.live {
    background: var(--cyan);
    box-shadow: 0 0 8px var(--cyan);
  }

  .dial-row {
    display: flex;
    justify-content: center;
    gap: 20px;
    margin-bottom: 18px;
  }
  .dial-wrap {
    display: flex;
    flex-direction: column;
    align-items: center;
  }
  svg { overflow: visible; }
  .dial-track { fill: none; stroke: var(--line); stroke-width: 6; }
  .dial-fill {
    fill: none;
    stroke-width: 6;
    stroke-linecap: round;
    transition: stroke-dashoffset .25s ease;
  }
  .dial-fill.on {
    stroke: var(--cyan);
    filter: drop-shadow(0 0 4px rgba(77,227,212,.5));
  }
  .dial-fill.off {
    stroke: var(--amber);
    filter: drop-shadow(0 0 4px rgba(224,164,88,.5));
  }
  .dial-center {
    font-size: 26px;
    font-weight: 300;
    fill: var(--text);
  }
  .dial-tag {
    font-size: 10px;
    color: var(--text-dim);
    letter-spacing: 1.5px;
    margin-top: 6px;
  }
  .slider-label {
    display: block;
    font-size: 10px;
    color: var(--text-dim);
    letter-spacing: 1px;
    margin-bottom: 2px;
  }

  input[type="range"] {
    width: 100%;
    -webkit-appearance: none;
    height: 3px;
    background: var(--line);
    border-radius: 2px;
    margin: 4px 0 20px;
  }
  input[type="range"]::-webkit-slider-thumb {
    -webkit-appearance: none;
    width: 14px; height: 14px;
    border-radius: 50%;
    background: var(--cyan);
    box-shadow: 0 0 6px var(--cyan);
    cursor: pointer;
    margin-top: -5.5px;
  }
  input[type="range"]::-moz-range-thumb {
    width: 14px; height: 14px;
    border: none;
    border-radius: 50%;
    background: var(--cyan);
    box-shadow: 0 0 6px var(--cyan);
    cursor: pointer;
  }

  .row { display: flex; gap: 10px; }
  button {
    flex: 1;
    font-family: inherit;
    font-size: 12px;
    letter-spacing: .5px;
    padding: 11px 14px;
    border-radius: 3px;
    border: 1px solid var(--line);
    background: transparent;
    color: var(--text);
    cursor: pointer;
    transition: border-color .15s, color .15s;
  }
  button:hover:not(:disabled) { border-color: var(--cyan-dim); color: var(--cyan); }
  button:disabled { opacity: .35; cursor: not-allowed; }
  button.primary {
    background: var(--cyan);
    color: #062421;
    border-color: var(--cyan);
    font-weight: 600;
  }
  button.primary:hover:not(:disabled) { background: #6ef0e0; color: #062421; }

  .log {
    margin-top: 18px;
    font-size: 10.5px;
    color: var(--text-dim);
    min-height: 16px;
    letter-spacing: .3px;
  }
  .log.err { color: var(--amber); }
</style>
</head>
<body>

<div class="panel">
  <h1>ROOMSWITCH — THRESHOLD</h1>
  <div class="sub">Bluetooth control · target angle for stepper travel</div>

  <div class="status-row">
    <div class="dot" id="dot"></div>
    <span id="statusText">Not connected</span>
  </div>

  <div class="dial-row">
    <div class="dial-wrap">
      <svg width="140" height="140" viewBox="0 0 140 140">
        <circle class="dial-track" cx="70" cy="70" r="58"></circle>
        <circle class="dial-fill on" id="onDialFill" cx="70" cy="70" r="58"
                stroke-dasharray="364.4" stroke-dashoffset="364.4"
                transform="rotate(-90 70 70)"></circle>
        <text x="70" y="75" text-anchor="middle" class="dial-center" id="onDialValue">--</text>
      </svg>
      <div class="dial-tag">ON ANGLE</div>
    </div>
    <div class="dial-wrap">
      <svg width="140" height="140" viewBox="0 0 140 140">
        <circle class="dial-track" cx="70" cy="70" r="58"></circle>
        <circle class="dial-fill off" id="offDialFill" cx="70" cy="70" r="58"
                stroke-dasharray="364.4" stroke-dashoffset="364.4"
                transform="rotate(-90 70 70)"></circle>
        <text x="70" y="75" text-anchor="middle" class="dial-center" id="offDialValue">--</text>
      </svg>
      <div class="dial-tag">OFF ANGLE</div>
    </div>
  </div>

  <label class="slider-label">On angle</label>
  <input type="range" id="onSlider" min="0" max="180" value="45" disabled>

  <label class="slider-label">Off angle</label>
  <input type="range" id="offSlider" min="0" max="180" value="0" disabled>

  <div class="row">
    <button id="connectBtn">Connect</button>
    <button id="applyBtn" class="primary" disabled>Set Thresholds</button>
  </div>

  <div class="log" id="log"></div>
</div>

<script>
  const SERVICE_UUID     = '4fafc201-1fb5-459e-8fcc-c5c9c331914b';
  const ON_CHAR_UUID     = 'beb5483e-36e1-4688-b7f5-ea07361b26a8';
  const OFF_CHAR_UUID    = 'd4e0e0e0-1a2b-4c3d-9e8f-7a6b5c4d3e2f';
  const MAX_ANGLE        = 180; // dial display range; motor itself accepts 0-360

  let onCharacteristic = null;
  let offCharacteristic = null;

  const dot = document.getElementById('dot');
  const statusText = document.getElementById('statusText');
  const onSlider = document.getElementById('onSlider');
  const offSlider = document.getElementById('offSlider');
  const onDialFill = document.getElementById('onDialFill');
  const offDialFill = document.getElementById('offDialFill');
  const onDialValue = document.getElementById('onDialValue');
  const offDialValue = document.getElementById('offDialValue');
  const connectBtn = document.getElementById('connectBtn');
  const applyBtn = document.getElementById('applyBtn');
  const log = document.getElementById('log');

  const CIRC = 2 * Math.PI * 58;

  function setLog(msg, isErr) {
    log.textContent = msg || '';
    log.className = 'log' + (isErr ? ' err' : '');
  }

  function updateDial(fillEl, valueEl, sliderEl, angle) {
    valueEl.textContent = angle;
    const frac = Math.min(angle / MAX_ANGLE, 1);
    fillEl.setAttribute('stroke-dashoffset', CIRC * (1 - frac));
    sliderEl.value = angle;
  }

  onSlider.addEventListener('input', () =>
    updateDial(onDialFill, onDialValue, onSlider, Number(onSlider.value)));
  offSlider.addEventListener('input', () =>
    updateDial(offDialFill, offDialValue, offSlider, Number(offSlider.value)));

  connectBtn.addEventListener('click', async () => {
    if (!navigator.bluetooth) {
      setLog('Web Bluetooth not supported — use Chrome or Edge, over HTTPS.', true);
      return;
    }
    try {
      setLog('Requesting device…');
      const device = await navigator.bluetooth.requestDevice({
        filters: [{ services: [SERVICE_UUID] }]
      });

      setLog('Connecting…');
      const server = await device.gatt.connect();
      const service = await server.getPrimaryService(SERVICE_UUID);
      onCharacteristic = await service.getCharacteristic(ON_CHAR_UUID);
      offCharacteristic = await service.getCharacteristic(OFF_CHAR_UUID);

      const onValue = await onCharacteristic.readValue();
      const offValue = await offCharacteristic.readValue();
      updateDial(onDialFill, onDialValue, onSlider, Number(new TextDecoder().decode(onValue)) || 0);
      updateDial(offDialFill, offDialValue, offSlider, Number(new TextDecoder().decode(offValue)) || 0);

      dot.classList.add('live');
      statusText.textContent = device.name || 'Connected';
      connectBtn.textContent = 'Connected';
      connectBtn.disabled = true;
      applyBtn.disabled = false;
      onSlider.disabled = false;
      offSlider.disabled = false;
      setLog('');

      device.addEventListener('gattserverdisconnected', onDisconnected);
    } catch (err) {
      setLog(err.message || 'Connection failed.', true);
    }
  });

  applyBtn.addEventListener('click', async () => {
    if (!onCharacteristic || !offCharacteristic) return;
    try {
      const onAngle = Number(onSlider.value);
      const offAngle = Number(offSlider.value);
      await onCharacteristic.writeValue(new TextEncoder().encode(String(onAngle)));
      await offCharacteristic.writeValue(new TextEncoder().encode(String(offAngle)));
      setLog('On: ' + onAngle + '° · Off: ' + offAngle + '°');
    } catch (err) {
      setLog(err.message || 'Write failed.', true);
    }
  });

  function onDisconnected() {
    dot.classList.remove('live');
    statusText.textContent = 'Not connected';
    connectBtn.textContent = 'Connect';
    connectBtn.disabled = false;
    applyBtn.disabled = true;
    onSlider.disabled = true;
    offSlider.disabled = true;
    onCharacteristic = null;
    offCharacteristic = null;
    setLog('Device disconnected.', true);
  }
</script>

</body>
</html>
