<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>JARVIS Remote</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body {
    height:100%; width:100%; overflow:hidden;
    background:#0a0a0c; color:#ebebf0;
    font-family:-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    touch-action:manipulation; user-select:none;
  }
  #app {
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    height:100vh; width:100vw; padding:20px; gap:16px;
  }
  .preview {
    width:100%; max-width:640px; aspect-ratio:4/3; border-radius:14px;
    background:#141416; border:1.5px solid #2a2a30; overflow:hidden; position:relative;
  }
  .preview video {
    width:100%; height:100%; object-fit:contain; display:block;
  }
  .preview .label {
    position:absolute; top:10px; left:10px;
    background:rgba(0,0,0,0.6); color:#eba53c;
    padding:4px 10px; border-radius:6px; font-size:11px; font-weight:600;
  }
  .btn {
    padding:14px 28px; border-radius:12px; border:none;
    background:linear-gradient(180deg,#eba53c,#c7852a); color:#0a0a0c;
    font-size:14px; font-weight:700; cursor:pointer;
    display:flex; align-items:center; gap:8px;
  }
  .btn:active { transform:scale(0.96); }
  .btn:disabled { opacity:0.5; cursor:not-allowed; }
  .status {
    font-size:13px; color:#6b6b76; text-align:center; max-width:500px;
  }
</style>
</head>
<body>
<div id="app">
  <div class="preview">
    <video id="phoneCam" autoplay playsinline></video>
    <div class="label" id="statusLabel">Waiting for laptop...</div>
  </div>

  <button class="btn" id="micBtn">
    <span>🎤</span> Hold to Talk
  </button>

  <div class="status" id="remoteStatus">
    Connect to JARVIS to receive camera and send audio.
  </div>
</div>

<script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js">
</script>
<script>
(function() {
  // Read host peer ID from query param, or use fixed ID matching the host page
  const params = new URLSearchParams(window.location.search);
  const hostPeerId = params.get('host') || 'jarvis-host-unique';

  let peer = null;
  let dataChannel = null;
  let micStream = null;
  let audioCtx = null;
  let scriptProcessor = null;

  const phoneCam = document.getElementById('phoneCam');
  const statusLabel = document.getElementById('statusLabel');
  const remoteStatus = document.getElementById('remoteStatus');
  const micBtn = document.getElementById('micBtn');

  function log(msg) {
    console.log('[JARVIS Remote]', msg);
    statusLabel.textContent = msg;
  }

  function init() {
    if (!hostPeerId) return;

    // Create PeerJS instance (connects to public signaling server)
    peer = new Peer(null, {
      host: '0.peerjs.com',
      port: 443,
      path: '/',
      secure: true,
      config: {
        iceServers: [
          { urls: 'stun:stun.l.google.com:19302' },
          { urls: 'stun:stun1.l.google.com:19302' },
        ]
      }
    });

    peer.on('open', (id) => {
      log('Connected to signaling server');
      remoteStatus.textContent = 'Connecting to laptop...';
      remoteStatus.style.color = '#eba53c';

      // Connect to host
      const conn = peer.connect(hostPeerId, { reliable: false });
      
      conn.on('open', () => {
        log('Connected to laptop');
        remoteStatus.textContent = 'Connected. Receiving camera...';
        dataChannel = conn;
        dataChannel.binaryType = 'arraybuffer';
      });

      conn.on('data', (data) => {
        // Handle incoming data if needed
      });

      conn.on('error', (err) => {
        console.error('Connection error:', err);
        remoteStatus.textContent = 'Connection error';
      });

      conn.on('close', () => {
        remoteStatus.textContent = 'Disconnected from laptop';
      });

      // Call host to receive video
      const call = peer.call(hostPeerId, new MediaStream());
      call.on('stream', (stream) => {
        log('Receiving camera feed');
        phoneCam.srcObject = stream;
        remoteStatus.textContent = 'Camera active. Hold mic to talk.';
      });

      call.on('error', (err) => {
        console.error('Call error:', err);
        remoteStatus.textContent = 'Video connection failed';
      });
    });

    peer.on('error', (err) => {
      console.error('Peer error:', err);
      remoteStatus.textContent = 'Signaling error: ' + err.type;
    });
  }

  async function startMic() {
    if (!dataChannel || dataChannel.readyState !== 'open') {
      alert('Not connected to laptop yet');
      return;
    }

    try {
      micStream = await navigator.mediaDevices.getUserMedia({
        audio: {
          echoCancellation: true,
          noiseSuppression: true,
          autoGainControl: true,
          sampleRate: 16000,
          channelCount: 1
        },
        video: false
      });

      audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      const source = audioCtx.createMediaStreamSource(micStream);
      scriptProcessor = audioCtx.createScriptProcessor(4096, 1, 1);

      scriptProcessor.onaudioprocess = (e) => {
        if (!dataChannel || dataChannel.readyState !== 'open') return;

        const input = e.inputBuffer.getChannelData(0);
        const int16 = new Int16Array(input.length);
        for (let i = 0; i < input.length; i++) {
          const s = Math.max(-1, Math.min(1, input[i]));
          int16[i] = s < 0 ? s * 0x8000 : s * 0x7FFF;
        }

        try {
          dataChannel.send(int16.buffer);
        } catch (err) {
          // Channel closed
        }
      };

      source.connect(scriptProcessor);

      micBtn.style.animation = 'pulse 1.2s infinite';
      remoteStatus.textContent = 'Talking...';

    } catch (e) {
      alert('Mic access denied: ' + e.message);
    }
  }

  function stopMic() {
    if (micStream) {
      micStream.getTracks().forEach(t => t.stop());
      micStream = null;
    }
    if (audioCtx) {
      audioCtx.close();
      audioCtx = null;
    }
    if (scriptProcessor) {
      scriptProcessor.disconnect();
      scriptProcessor = null;
    }
    micBtn.style.animation = '';
    remoteStatus.textContent = 'Connected to JARVIS';
    remoteStatus.style.color = '#eba53c';
  }

  // Pulse animation
  const style = document.createElement('style');
  style.textContent = '@keyframes pulse { 0%,100% { box-shadow:0 0 20px rgba(235,165,60,0.4); } 50% { box-shadow:0 0 40px rgba(235,165,60,0.7); } }';
  document.head.appendChild(style);

  // Mic button events
  micBtn.addEventListener('mousedown', startMic);
  micBtn.addEventListener('mouseup', stopMic);
  micBtn.addEventListener('mouseleave', stopMic);
  micBtn.addEventListener('touchstart', (e) => { e.preventDefault(); startMic(); });
  micBtn.addEventListener('touchend', (e) => { e.preventDefault(); stopMic(); });

  // Initialize on load
  if (hostPeerId) {
    init();
  }
})();
</script>
</body>
</html>
