<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Garage Control</title>

<!-- iOS "Add to Home Screen" support -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Garage">
<meta name="theme-color" content="#000000">
<link rel="manifest" href="manifest.json">

<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0; padding: 0; height: 100%;
    background: #000000;
    font-family: -apple-system, "SF Mono", ui-monospace, monospace;
    overscroll-behavior: none;
    touch-action: manipulation;
    -webkit-user-select: none;
    user-select: none;
  }
  .app {
    min-height: 100vh;
    min-height: 100dvh;
    max-width: 480px;
    margin: 0 auto;
    padding: calc(env(safe-area-inset-top, 20px) + 8px) 20px calc(env(safe-area-inset-bottom, 20px) + 8px);
    display: flex;
    flex-direction: column;
  }
  .topbar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding-bottom: 14px;
    border-bottom: 1px solid #17232f;
    margin-bottom: 8px;
  }
  .brand { display: flex; align-items: center; gap: 8px; }
  .brand-dot {
    width: 8px; height: 8px; background: #33e0ff;
    clip-path: polygon(50% 0, 100% 50%, 50% 100%, 0 50%);
  }
  .brand-text { color: #d8ecf5; font-size: 12px; font-weight: 700; letter-spacing: 2px; }
  .status-pill {
    display: flex; align-items: center; gap: 5px;
    padding: 4px 10px; border: 1px solid #64808f; border-radius: 4px;
  }
  .status-dot { width: 6px; height: 6px; border-radius: 50%; background: #64808f; }
  .status-text { font-size: 10px; font-weight: 700; color: #64808f; }
  .status-pill.online { border-color: #35e08a; }
  .status-pill.online .status-dot { background: #35e08a; }
  .status-pill.online .status-text { color: #35e08a; }
  .status-pill.offline { border-color: #ff4b4b; }
  .status-pill.offline .status-dot { background: #ff4b4b; }
  .status-pill.offline .status-text { color: #ff4b4b; }

  .center-area {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
  }
  .dial-wrap {
    position: relative;
    width: 204px; height: 204px;
    display: flex; align-items: center; justify-content: center;
    margin-bottom: 20px;
  }
  .ring {
    position: absolute;
    width: 204px; height: 204px;
    border-radius: 102px;
    border: 4px solid transparent;
    opacity: 0;
    pointer-events: none;
  }
  .ring.spinning {
    animation: spin 0.9s linear infinite;
    opacity: 1;
    border-top-color: #33e0ff;
    border-right-color: #33e0ff;
  }
  @keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }

  .dial {
    border: none; padding: 0; cursor: pointer;
    width: 180px; height: 180px; border-radius: 90px;
    background: #64808f;
    display: flex; align-items: center; justify-content: center;
    transition: background 0.3s, opacity 0.2s, transform 0.1s;
    -webkit-touch-callout: none;
  }
  .dial:active:not(:disabled) { transform: scale(0.96); }
  .dial:disabled { opacity: 0.4; cursor: default; }
  .dial.open { background: #33e0ff; }

  .sub-label { color: #64808f; font-size: 11px; letter-spacing: 2px; margin-bottom: 4px; }
  .center-label { color: #d8ecf5; font-size: 20px; font-weight: 700; letter-spacing: 2px; }
  .center-label.sending { color: #64808f; }

  .footer { text-align: center; color: #64808f; font-size: 10px; letter-spacing: 1px; padding-top: 12px; }
</style>
</head>
<body>

<div class="app">
  <div class="topbar">
    <div class="brand">
      <div class="brand-dot"></div>
      <span class="brand-text">GARAGE CONTROL</span>
    </div>
    <div id="statusPill" class="status-pill offline">
      <div class="status-dot"></div>
      <span id="statusText" class="status-text">CONNECTING</span>
    </div>
  </div>

  <div class="center-area">
    <div class="dial-wrap">
      <div id="ring" class="ring"></div>
      <button id="dial" class="dial" onclick="pressButton()" disabled>
        <svg width="64" height="56" viewBox="0 0 64 56">
          <path d="M2 20 L32 2 L62 20 Z" fill="#000000"/>
          <rect x="6" y="18" width="52" height="34" rx="4" fill="#000000"/>
          <rect x="14" y="26" width="36" height="3" rx="1.5" fill="rgba(255,255,255,0.35)"/>
          <rect x="14" y="34" width="36" height="3" rx="1.5" fill="rgba(255,255,255,0.35)"/>
          <rect x="14" y="42" width="36" height="3" rx="1.5" fill="rgba(255,255,255,0.35)"/>
        </svg>
      </button>
    </div>
    <div class="sub-label">GARAGE DOOR</div>
    <div id="label" class="center-label">CONNECTING</div>
  </div>

  <div id="footer" class="footer">Auto-refreshing every 3s</div>
</div>

<script>
// ---- Fill these in with your own Firebase details ----
const FIREBASE_URL = "https://garagecontroller-593f2-default-rtdb.firebaseio.com";
const FIREBASE_SECRET = "PASTE_YOUR_DATABASE_SECRET_HERE";
// --------------------------------------------------------

const POLL_INTERVAL_MS = 3000;
const MIN_SPIN_MS = 1400;

let online = null;      // null = unknown, true/false = known
let doorState = "closed"; // assumed only -- no real door sensor
let sending = false;

const dial = document.getElementById("dial");
const ring = document.getElementById("ring");
const label = document.getElementById("label");
const statusPill = document.getElementById("statusPill");
const statusText = document.getElementById("statusText");
const footer = document.getElementById("footer");

function baseUrl() {
  return `${FIREBASE_URL}/.json?auth=${FIREBASE_SECRET}`;
}

async function fetchGarageOnline() {
  const res = await fetch(baseUrl());
  if (!res.ok) throw new Error("GET failed: " + res.status);
  const data = await res.json();
  return Boolean(data && data.garageOnline);
}

async function patchGarage(patch) {
  const res = await fetch(baseUrl(), {
    method: "PATCH",
    headers: { "content-type": "application/json" },
    body: JSON.stringify(patch),
  });
  if (!res.ok) throw new Error("PATCH failed: " + res.status);
}

function renderStatus() {
  statusPill.classList.remove("online", "offline");
  if (online === true) {
    statusPill.classList.add("online");
    statusText.textContent = "ONLINE";
  } else if (online === false) {
    statusPill.classList.add("offline");
    statusText.textContent = "OFFLINE";
  } else {
    statusText.textContent = "CONNECTING";
  }

  dial.disabled = online !== true || sending;
  footer.textContent = online === false
    ? "Garage unit unreachable \u2014 controls disabled"
    : "Tap to toggle";

  if (!sending) {
    dial.classList.toggle("open", doorState === "open");
    label.classList.remove("sending");
    label.textContent = online === null
      ? "CONNECTING"
      : (doorState === "open" ? "OPEN" : "CLOSED");
  }
}

async function poll() {
  try {
    online = await fetchGarageOnline();
  } catch (err) {
    console.warn("Status poll failed:", err);
    online = null;
  }
  renderStatus();
}

async function pressButton() {
  if (sending || online !== true) return;
  sending = true;

  if ('vibrate' in navigator) navigator.vibrate(40); // no-op on iOS Safari, works on Android Chrome

  const goingTo = doorState === "closed" ? "open" : "closed";
  label.textContent = goingTo === "open" ? "Opening" : "Closing";
  label.classList.add("sending");
  ring.classList.add("spinning");
  renderStatus();

  const started = Date.now();
  try {
    if (goingTo === "open") {
      await patchGarage({ openGarage: true });
    } else {
      await patchGarage({ closeGarage: true });
    }
  } catch (err) {
    alert("Command failed: " + err.message);
  } finally {
    const elapsed = Date.now() - started;
    const wait = Math.max(0, MIN_SPIN_MS - elapsed);
    setTimeout(() => {
      ring.classList.remove("spinning");
      doorState = goingTo;
      sending = false;
      if ('vibrate' in navigator) navigator.vibrate(15);
      renderStatus();
      setTimeout(poll, 500);
    }, wait);
  }
}

poll();
setInterval(poll, POLL_INTERVAL_MS);
</script>

</body>
</html>
