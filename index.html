<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>RoomSwitch ESP32</title>

<style>
  * {
    box-sizing: border-box;
  }

  body {
    margin: 0;
    min-height: 100vh;
    background: #050505;
    color: #f2f2f2;
    font-family: Arial, Helvetica, sans-serif;
    display: flex;
    justify-content: center;
    align-items: center;
  }

  .panel {
    width: min(650px, 92vw);
    background: #0d0d0d;
    border: 1px solid #292929;
    border-radius: 22px;
    padding: 30px;
    box-shadow: 0 20px 60px rgba(0,0,0,.5);
  }

  .top {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 20px;
    margin-bottom: 28px;
  }

  h1 {
    margin: 0;
    font-size: 26px;
    letter-spacing: .5px;
  }

  .subtitle {
    color: #888;
    margin-top: 6px;
    font-size: 13px;
  }

  .status {
    padding: 9px 13px;
    border-radius: 999px;
    background: #191919;
    color: #aaa;
    font-size: 12px;
    white-space: nowrap;
  }

  .status.connected {
    color: #fff;
    border: 1px solid #444;
  }

  .section {
    background: #111;
    border: 1px solid #242424;
    border-radius: 16px;
    padding: 20px;
    margin-top: 15px;
  }

  .section-title {
    font-size: 14px;
    color: #aaa;
    margin-bottom: 17px;
    text-transform: uppercase;
    letter-spacing: 1px;
  }

  .angle-row {
    display: grid;
    grid-template-columns: 1fr 100px;
    align-items: center;
    gap: 18px;
    margin-bottom: 20px;
  }

  .angle-row:last-child {
    margin-bottom: 0;
  }

  label {
    display: block;
    font-size: 14px;
    margin-bottom: 10px;
  }

  input[type="range"] {
    width: 100%;
    accent-color: white;
    cursor: pointer;
  }

  input[type="number"] {
    width: 100%;
    background: #080808;
    border: 1px solid #333;
    color: white;
    border-radius: 10px;
    padding: 11px;
    font-size: 16px;
    text-align: center;
  }

  .angle-value {
    color: #aaa;
    font-size: 12px;
  }

  .buttons {
    display: grid;
    grid-template-columns: 1fr 1fr 1fr;
    gap: 10px;
  }

  button {
    border: 1px solid #333;
    background: #171717;
    color: white;
    border-radius: 12px;
    padding: 13px;
    font-size: 14px;
    cursor: pointer;
    transition: .15s;
  }

  button:hover {
    background: #242424;
    border-color: #555;
  }

  button.primary {
    background: white;
    color: black;
    border-color: white;
  }

  button.primary:hover {
    background: #ddd;
  }

  button:disabled {
    opacity: .4;
    cursor: not-allowed;
  }

  .connect {
    width: 100%;
    margin-top: 18px;
    padding: 15px;
  }

  .log {
    margin-top: 15px;
    min-height: 90px;
    max-height: 150px;
    overflow-y: auto;
    background: #070707;
    border: 1px solid #222;
    border-radius: 12px;
    padding: 12px;
    color: #777;
    font-family: Consolas, monospace;
    font-size: 11px;
    white-space: pre-wrap;
  }

  .hint {
    color: #666;
    font-size: 11px;
    line-height: 1.5;
    margin-top: 16px;
  }

  @media (max-width: 560px) {
    .angle-row {
      grid-template-columns: 1fr;
    }

    .buttons {
      grid-template-columns: 1fr;
    }

    .top {
      align-items: flex-start;
      flex-direction: column;
    }
  }
</style>
</head>

<body>

<div class="panel">

  <div class="top">
    <div>
      <h1>RoomSwitch</h1>
      <div class="subtitle">
        ESP32 • 28BYJ-48 • ULN2003
      </div>
    </div>

    <div id="status" class="status">
      Disconnected
    </div>
  </div>

  <div class="section">

    <div class="section-title">
      Motor Angles
    </div>

    <div class="angle-row">
      <div>
        <label for="onSlider">
          ON Angle
          <span class="angle-value">
            — motor position when switch is ON
          </span>
        </label>

        <input
          id="onSlider"
          type="range"
          min="0"
          max="360"
          value="45"
        >
      </div>

      <input
        id="onNumber"
        type="number"
        min="0"
        max="360"
        value="45"
      >
    </div>

    <div class="angle-row">
      <div>
        <label for="offSlider">
          OFF Angle
          <span class="angle-value">
            — motor position when switch is OFF
          </span>
        </label>

        <input
          id="offSlider"
          type="range"
          min="0"
          max="360"
          value="0"
        >
      </div>

      <input
        id="offNumber"
        type="number"
        min="0"
        max="360"
        value="0"
      >
    </div>

  </div>

  <div class="section">

    <div class="section-title">
      Switch Control
    </div>

    <div class="buttons">
      <button id="onButton" onclick="sendState('ON')" disabled>
        ON
      </button>

      <button id="offButton" onclick="sendState('OFF')" disabled>
        OFF
      </button>

      <button id="toggleButton" onclick="sendState('TOGGLE')" disabled>
        TOGGLE
      </button>
    </div>

  </div>

  <button
    id="connectButton"
    class="connect primary"
    onclick="connectBluetooth()"
  >
    Connect to ESP32
  </button>

  <div id="log" class="log">Waiting for Bluetooth...</div>

  <div class="hint">
    This page uses Web Bluetooth. Use Chrome or Edge on a computer/device
    that supports Bluetooth. The ESP32 must be powered on and advertising
    as "RoomSwitch-ESP32".
  </div>

</div>

<script>
  // ============================================================
  // BLE UUIDs — MUST MATCH THE ESP32 .INO
  // ============================================================

  const SERVICE_UUID =
    "4fafc201-1fb5-459e-8fcc-c5c9c331914b";

  const ON_ANGLE_UUID =
    "beb5483e-36e1-4688-b7f5-ea07361b26a8";

  const OFF_ANGLE_UUID =
    "beb5483e-36e1-4688-b7f5-ea07361b26b";

  const STATE_UUID =
    "beb5483e-36e1-4688-b7f5-ea07361b26c";

  let bluetoothDevice = null;
  let onAngleCharacteristic = null;
  let offAngleCharacteristic = null;
  let stateCharacteristic = null;

  const statusElement =
    document.getElementById("status");

  const logElement =
    document.getElementById("log");

  const connectButton =
    document.getElementById("connectButton");

  const onButton =
    document.getElementById("onButton");

  const offButton =
    document.getElementById("offButton");

  const toggleButton =
    document.getElementById("toggleButton");

  function log(message) {
    const time =
      new Date().toLocaleTimeString();

    logElement.textContent +=
      `[${time}] ${message}\n`;

    logElement.scrollTop =
      logElement.scrollHeight;
  }

  function setConnectedUI(connected) {
    if (connected) {
      statusElement.textContent = "Connected";
      statusElement.classList.add("connected");

      connectButton.textContent =
        "Connected to RoomSwitch-ESP32";

      onButton.disabled = false;
      offButton.disabled = false;
      toggleButton.disabled = false;
    }
    else {
      statusElement.textContent =
        "Disconnected";

      statusElement.classList.remove(
        "connected"
      );

      connectButton.textContent =
        "Connect to ESP32";

      onButton.disabled = true;
      offButton.disabled = true;
      toggleButton.disabled = true;
    }
  }

  // ============================================================
  // BYTE / TEXT HELPERS
  // ============================================================

  function textFromDataView(dataView) {
    return new TextDecoder().decode(dataView);
  }

  async function writeText(characteristic, text) {
    const data =
      new TextEncoder().encode(text);

    await characteristic.writeValue(data);
  }

  // ============================================================
  // READ CURRENT SETTINGS
  // ============================================================

  async function readSettings() {
    try {
      const onValue =
        await onAngleCharacteristic.readValue();

      const offValue =
        await offAngleCharacteristic.readValue();

      const onAngle =
        parseInt(textFromDataView(onValue));

      const offAngle =
        parseInt(textFromDataView(offValue));

      if (!isNaN(onAngle)) {
        setOnAngle(onAngle);
      }

      if (!isNaN(offAngle)) {
        setOffAngle(offAngle);
      }

      log(
        `Loaded angles: ON ${onAngle}°, OFF ${offAngle}°`
      );
    }
    catch (error) {
      log(
        "Could not read settings: " +
        error
      );
    }
  }

  // ============================================================
  // ANGLE UI
  // ============================================================

  const onSlider =
    document.getElementById("onSlider");

  const onNumber =
    document.getElementById("onNumber");

  const offSlider =
    document.getElementById("offSlider");

  const offNumber =
    document.getElementById("offNumber");

  function setOnAngle(value) {
    value = Math.max(
      0,
      Math.min(360, parseInt(value) || 0)
    );

    onSlider.value = value;
    onNumber.value = value;
  }

  function setOffAngle(value) {
    value = Math.max(
      0,
      Math.min(360, parseInt(value) || 0)
    );

    offSlider.value = value;
    offNumber.value = value;
  }

  onSlider.addEventListener(
    "input",
    () => {
      setOnAngle(onSlider.value);
    }
  );

  onNumber.addEventListener(
    "change",
    () => {
      setOnAngle(onNumber.value);
      sendOnAngle();
    }
  );

  offSlider.addEventListener(
    "input",
    () => {
      setOffAngle(offSlider.value);
    }
  );

  offNumber.addEventListener(
    "change",
    () => {
      setOffAngle(offNumber.value);
      sendOffAngle();
    }
  );

  // Send slider value after user releases it.
  onSlider.addEventListener(
    "change",
    sendOnAngle
  );

  offSlider.addEventListener(
    "change",
    sendOffAngle
  );

  async function sendOnAngle() {
    if (!onAngleCharacteristic) {
      log("Not connected.");
      return;
    }

    const value =
      parseInt(onNumber.value);

    if (isNaN(value)) {
      return;
    }

    try {
      await writeText(
        onAngleCharacteristic,
        String(value)
      );

      log(
        `ON angle -> ${value}°`
      );
    }
    catch (error) {
      log(
        "ON angle error: " + error
      );
    }
  }

  async function sendOffAngle() {
    if (!offAngleCharacteristic) {
      log("Not connected.");
      return;
    }

    const value =
      parseInt(offNumber.value);

    if (isNaN(value)) {
      return;
    }

    try {
      await writeText(
        offAngleCharacteristic,
        String(value)
      );

      log(
        `OFF angle -> ${value}°`
      );
    }
    catch (error) {
      log(
        "OFF angle error: " + error
      );
    }
  }

  // ============================================================
  // STATE CONTROL
  // ============================================================

  async function sendState(state) {
    if (!stateCharacteristic) {
      log("Not connected.");
      return;
    }

    try {
      await writeText(
        stateCharacteristic,
        state
      );

      log(
        `Switch command -> ${state}`
      );
    }
    catch (error) {
      log(
        "State error: " + error
      );
    }
  }

  // ============================================================
  // BLUETOOTH
  // ============================================================

  async function connectBluetooth() {

    if (!navigator.bluetooth) {
      alert(
        "Web Bluetooth is not available in this browser. " +
        "Try Chrome or Edge."
      );

      return;
    }

    try {
      log(
        "Opening Bluetooth device picker..."
      );

      bluetoothDevice =
        await navigator.bluetooth.requestDevice({
          filters: [
            {
              name: "RoomSwitch-ESP32"
            }
          ],
          optionalServices: [
            SERVICE_UUID
          ]
        });

      bluetoothDevice.addEventListener(
        "gattserverdisconnected",
        handleDisconnect
      );

      log(
        "Device selected: " +
        bluetoothDevice.name
      );

      const server =
        await bluetoothDevice.gatt.connect();

      log("GATT connected.");

      const service =
        await server.getPrimaryService(
          SERVICE_UUID
        );

      onAngleCharacteristic =
        await service.getCharacteristic(
          ON_ANGLE_UUID
        );

      offAngleCharacteristic =
        await service.getCharacteristic(
          OFF_ANGLE_UUID
        );

      stateCharacteristic =
        await service.getCharacteristic(
          STATE_UUID
        );

      setConnectedUI(true);

      log(
        "RoomSwitch Bluetooth connected."
      );

      await readSettings();

      // Read current state
      try {
        const stateValue =
          await stateCharacteristic.readValue();

        const state =
          textFromDataView(stateValue);

        log(
          `Current state: ${state}`
        );
      }
      catch (error) {
        log(
          "Could not read state: " +
          error
        );
      }

    }
    catch (error) {
      log(
        "Bluetooth connection failed: " +
        error
      );

      setConnectedUI(false);
    }
  }

  function handleDisconnect() {
    log("ESP32 disconnected.");
    setConnectedUI(false);

    onAngleCharacteristic = null;
    offAngleCharacteristic = null;
    stateCharacteristic = null;
  }

  // ============================================================
  // INITIAL UI
  // ============================================================

  setOnAngle(45);
  setOffAngle(0);

  if (!navigator.bluetooth) {
    log(
      "Web Bluetooth is unavailable in this browser."
    );
  }
</script>

</body>
</html>
