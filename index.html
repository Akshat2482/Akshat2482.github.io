<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>Room Switch Control</title>

<style>

body {
    margin: 0;
    padding: 30px;
    background: #000;
    color: white;
    font-family: Arial, sans-serif;
}

.container {
    max-width: 500px;
    margin: auto;
}

h1 {
    text-align: center;
    margin-bottom: 30px;
}

.section {
    border: 1px solid #333;
    border-radius: 15px;
    padding: 20px;
    margin-bottom: 20px;
}

.section h2 {
    margin-top: 0;
}

label {
    display: block;
    margin-top: 15px;
    margin-bottom: 7px;
}

input {
    width: 100%;
    box-sizing: border-box;
    padding: 13px;
    border-radius: 10px;
    border: 1px solid #444;
    background: #111;
    color: white;
    font-size: 17px;
}

button {
    width: 100%;
    padding: 15px;
    margin-top: 15px;
    border: none;
    border-radius: 10px;
    background: white;
    color: black;
    font-size: 17px;
    cursor: pointer;
}

button:hover {
    opacity: 0.85;
}

#status {
    text-align: center;
    margin-top: 20px;
    color: #aaa;
}

.saved {
    margin-top: 20px;
    padding: 15px;
    border-radius: 10px;
    background: #111;
    border: 1px solid #333;
}

</style>
</head>

<body>

<div class="container">

<h1>Room Switch</h1>

<button onclick="connectBluetooth()">
    Connect to ESP32
</button>

<div id="status">
    Not connected
</div>

<!-- ========================================= -->
<!-- ON -> OFF -->
<!-- ========================================= -->

<div class="section">

<h2>ON → OFF</h2>

<label>
    Angle (degrees)
</label>

<input
    id="onOffAngle"
    type="number"
    min="0"
    max="360"
    value="360"
>

<label>
    Times
</label>

<input
    id="onOffTimes"
    type="number"
    min="1"
    max="100"
    value="1"
>

</div>

<!-- ========================================= -->
<!-- OFF -> ON -->
<!-- ========================================= -->

<div class="section">

<h2>OFF → ON</h2>

<label>
    Angle (degrees)
</label>

<input
    id="offOnAngle"
    type="number"
    min="0"
    max="360"
    value="360"
>

<label>
    Times
</label>

<input
    id="offOnTimes"
    type="number"
    min="1"
    max="100"
    value="1"
>

</div>

<button onclick="saveSettings()">
    Save Settings
</button>

<div class="saved">

    <strong>Current Saved Settings</strong>

    <div id="savedValues">
        Not connected
    </div>

</div>

</div>

<script>

// =====================================================
// BLE UUIDS
// =====================================================

const SERVICE_UUID =
    "4fafc201-1fb5-459e-8fcc-c5c9c331914b";

const ON_TO_OFF_ANGLE_UUID =
    "beb5483e-36e1-4688-b7f5-ea07361b26a8";

const ON_TO_OFF_TIMES_UUID =
    "7a6b5c4d-3e2f-4a1b-8c9d-0e1f2a3b4c5d";

const OFF_TO_ON_ANGLE_UUID =
    "d4e0e0e0-1a2b-4c3d-9e8f-7a6b5c4d3e2f";

const OFF_TO_ON_TIMES_UUID =
    "c3d2e1f0-9a8b-7c6d-5e4f-3a2b1c0d9e8f";

// =====================================================
// BLE VARIABLES
// =====================================================

let device = null;

let onToOffAngleCharacteristic = null;
let onToOffTimesCharacteristic = null;

let offToOnAngleCharacteristic = null;
let offToOnTimesCharacteristic = null;

// =====================================================
// STATUS
// =====================================================

function setStatus(message) {

    document.getElementById("status").textContent =
        message;
}

// =====================================================
// CONNECT
// =====================================================

async function connectBluetooth() {

    try {

        if (!navigator.bluetooth) {

            setStatus(
                "Web Bluetooth is not supported. Use Chrome or Edge."
            );

            return;
        }

        setStatus("Looking for ESP32...");

        device =
            await navigator.bluetooth.requestDevice({

                filters: [
                    {
                        name: "RoomSwitch-ESP32"
                    }
                ],

                optionalServices: [
                    SERVICE_UUID
                ]
            });

        setStatus("Connecting...");

        const server =
            await device.gatt.connect();

        const service =
            await server.getPrimaryService(
                SERVICE_UUID
            );

        onToOffAngleCharacteristic =
            await service.getCharacteristic(
                ON_TO_OFF_ANGLE_UUID
            );

        onToOffTimesCharacteristic =
            await service.getCharacteristic(
                ON_TO_OFF_TIMES_UUID
            );

        offToOnAngleCharacteristic =
            await service.getCharacteristic(
                OFF_TO_ON_ANGLE_UUID
            );

        offToOnTimesCharacteristic =
            await service.getCharacteristic(
                OFF_TO_ON_TIMES_UUID
            );

        setStatus("Connected to ESP32");

        await readSettings();

    } catch (error) {

        console.error(error);

        setStatus(
            "Connection failed: " + error.message
        );
    }
}

// =====================================================
// READ CHARACTERISTIC
// =====================================================

async function readValue(characteristic) {

    const result =
        await characteristic.readValue();

    const decoder =
        new TextDecoder();

    return decoder.decode(result);
}

// =====================================================
// READ SETTINGS
// =====================================================

async function readSettings() {

    try {

        const onOffAngle =
            await readValue(
                onToOffAngleCharacteristic
            );

        const onOffTimes =
            await readValue(
                onToOffTimesCharacteristic
            );

        const offOnAngle =
            await readValue(
                offToOnAngleCharacteristic
            );

        const offOnTimes =
            await readValue(
                offToOnTimesCharacteristic
            );

        document.getElementById(
            "onOffAngle"
        ).value = parseInt(onOffAngle);

        document.getElementById(
            "onOffTimes"
        ).value = parseInt(onOffTimes);

        document.getElementById(
            "offOnAngle"
        ).value = parseInt(offOnAngle);

        document.getElementById(
            "offOnTimes"
        ).value = parseInt(offOnTimes);

        updateSavedDisplay(
            onOffAngle,
            onOffTimes,
            offOnAngle,
            offOnTimes
        );

    } catch (error) {

        console.error(error);

        setStatus(
            "Could not read settings"
        );
    }
}

// =====================================================
// WRITE VALUE
// =====================================================

async function writeValue(
    characteristic,
    value
) {

    const encoder =
        new TextEncoder();

    await characteristic.writeValue(
        encoder.encode(
            String(value)
        )
    );
}

// =====================================================
// SAVE SETTINGS
// =====================================================

async function saveSettings() {

    if (
        !onToOffAngleCharacteristic ||
        !onToOffTimesCharacteristic ||
        !offToOnAngleCharacteristic ||
        !offToOnTimesCharacteristic
    ) {

        setStatus(
            "Connect to ESP32 first"
        );

        return;
    }

    try {

        let onOffAngle =
            parseInt(
                document.getElementById(
                    "onOffAngle"
                ).value
            );

        let onOffTimes =
            parseInt(
                document.getElementById(
                    "onOffTimes"
                ).value
            );

        let offOnAngle =
            parseInt(
                document.getElementById(
                    "offOnAngle"
                ).value
            );

        let offOnTimes =
            parseInt(
                document.getElementById(
                    "offOnTimes"
                ).value
            );

        // Safety limits

        onOffAngle =
            Math.max(
                0,
                Math.min(360, onOffAngle)
            );

        onOffTimes =
            Math.max(
                1,
                Math.min(100, onOffTimes)
            );

        offOnAngle =
            Math.max(
                0,
                Math.min(360, offOnAngle)
            );

        offOnTimes =
            Math.max(
                1,
                Math.min(100, offOnTimes)
            );

        // Put corrected values back into inputs

        document.getElementById(
            "onOffAngle"
        ).value = onOffAngle;

        document.getElementById(
            "onOffTimes"
        ).value = onOffTimes;

        document.getElementById(
            "offOnAngle"
        ).value = offOnAngle;

        document.getElementById(
            "offOnTimes"
        ).value = offOnTimes;

        setStatus(
            "Saving settings..."
        );

        // Save ON -> OFF

        await writeValue(
            onToOffAngleCharacteristic,
            onOffAngle
        );

        await writeValue(
            onToOffTimesCharacteristic,
            onOffTimes
        );

        // Save OFF -> ON

        await writeValue(
            offToOnAngleCharacteristic,
            offOnAngle
        );

        await writeValue(
            offToOnTimesCharacteristic,
            offOnTimes
        );

        updateSavedDisplay(
            onOffAngle,
            onOffTimes,
            offOnAngle,
            offOnTimes
        );

        setStatus(
            "Settings saved to ESP32"
        );

    } catch (error) {

        console.error(error);

        setStatus(
            "Save failed: " + error.message
        );
    }
}

// =====================================================
// SAVED SETTINGS DISPLAY
// =====================================================

function updateSavedDisplay(
    onOffAngle,
    onOffTimes,
    offOnAngle,
    offOnTimes
) {

    document.getElementById(
        "savedValues"
    ).innerHTML =

        "ON → OFF: " +
        onOffAngle +
        "° × " +
        onOffTimes +
        "<br><br>" +

        "OFF → ON: " +
        offOnAngle +
        "° × " +
        offOnTimes;
}

// =====================================================
// DISCONNECT DETECTION
// =====================================================

function disconnected() {

    setStatus(
        "ESP32 disconnected"
    );
}

</script>

</body>
</html>
