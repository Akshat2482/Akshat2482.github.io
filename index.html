<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>JARVIS Remote</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body {
    height:100%; width:100%; overflow:hidden;
    background:#0a0a0c; color:#ebebf0;
    font-family:-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    touch-action:manipulation; user-select:none;
  }
  #app {
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    height:100vh; width:100vw; padding:20px; gap:16px;
  }
  .preview {
    width:100%; max-width:640px; aspect-ratio:4/3; border-radius:14px;
    background:#141416; border:1.5px solid #2a2a30; overflow:hidden; position:relative;
  }
  .preview video {
    width:100%; height:100%; object-fit:contain; display:block;
  }
  .preview .label {
    position:absolute; top:10px; left:10px;
    background:rgba(0,0,0,0.6); color:#eba53c;
    padding:4px 10px; border-radius:6px; font-size:11px; font-weight:600;
  }
  .btn {
    padding:14px 28px; border-radius:12px; border:none;
    background:linear-gradient(180deg,#eba53c,#c7852a); color:#0a0a0c;
    font-size:14px; font-weight:700; cursor:pointer;
    display:flex; align-items:center; gap:8px;
  }
  .btn:active { transform:scale(0.96); }
  .btn:disabled { opacity:0.5; cursor:not-allowed; }
  .status {
    font-size:13px; color:#6b6b76; text-align:center; max-width:500px;
  }
</style>
</head>
<body>
<div id="app">
  <div class="preview">
    <video id="phoneCam" autoplay playsinline></video>
    <div class="label" id="statusLabel">Waiting for laptop...</div>
  </div>

  <button class="btn" id="micBtn">
    <span>🎤</span> Hold to Talk
  </button>

  <div class="status" id="remoteStatus">
    Connect to JARVIS to receive camera and send audio.
  </div>
</div>

<script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js">
</script>
<script>
(function() {
  const params = new URLSearchParams(window.location.search);
  let hostPeerId = params.get('host') || '1234567890';
  if (hostPeerId) {
    hostPeerId = hostPeerId.replace(/^<|>$/g, '').trim();
  }

  let peer = null;
  let dataChannel = null;
  let pc = null;
  let micStream = null;
  let audioCtx = null;
  let scriptProcessor = null;
  let retryCount = 0;
  const MAX_RETRIES = 10;
  let retryTimer = null;
  let connecting = false;

  const phoneCam = document.getElementById('phoneCam');
  const statusLabel = document.getElementById('statusLabel');
  const remoteStatus = document.getElementById('remoteStatus');
  const micBtn = document.getElementById('micBtn');

  function log(msg) {
    console.log('[JARVIS Remote]', msg);
    statusLabel.textContent = msg;
  }

  function playAudioChunk(int16Array) {
    if (!audioCtx) {
      audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    }
    const float32 = new Float32Array(int16Array.length);
    for (let i = 0; i < int16Array.length; i++) {
      float32[i] = int16Array[i] / 0x8000;
    }
    const buffer = audioCtx.createBuffer(1, float32.length, 16000);
    buffer.getChannelData(0).set(float32);
    const source = audioCtx.createBufferSource();
    source.buffer = buffer;
    source.connect(audioCtx.destination);
    source.start();
  }

  function clearRetry() {
    if (retryTimer) {
      clearTimeout(retryTimer);
      retryTimer = null;
    }
  }

  function scheduleRetry(fn, attempt) {
    clearRetry();
    const delay = Math.min(1000 * Math.pow(1.5, attempt), 8000);
    retryTimer = setTimeout(() => {
      retryTimer = null;
      fn();
    }, delay);
  }

  function connectToHost() {
    if (!peer || !peer.id || connecting) return;
    connecting = true;

    if (pc) {
      try { pc.close(); } catch (e) {}
      pc = null;
    }

    log('Connecting to laptop...');
    remoteStatus.textContent = 'Connecting to laptop...';
    remoteStatus.style.color = '#eba53c';

    const conn = peer.connect(hostPeerId, { reliable: false });
    
    conn.on('open', () => {
      log('Data channel open');
      remoteStatus.textContent = 'Data connected. Establishing video...';
      remoteStatus.style.color = '#eba53c';
      dataChannel = conn;
      dataChannel.binaryType = 'arraybuffer';
      retryCount = 0;
      connecting = false;

      setTimeout(() => {
        log('Starting video call...');
        remoteStatus.textContent = 'Starting video call...';
        makeCall();
      }, 2000);
    });

    conn.on('data', (data) => {
      if (data instanceof ArrayBuffer) {
        const int16 = new Int16Array(data);
        playAudioChunk(int16);
      }
    });

    conn.on('error', (err) => {
      console.error('Connection error:', err);
      remoteStatus.textContent = 'Data connection error';
      connecting = false;
    });

    conn.on('close', () => {
      remoteStatus.textContent = 'Disconnected from laptop';
      dataChannel = null;
      connecting = false;
      scheduleRetry(connectToHost, 0);
    });
  }

  function makeCall() {
    if (!dataChannel || dataChannel.readyState !== 'open') {
      scheduleRetry(makeCall, retryCount);
      return;
    }

    console.log('Phone creating RTCPeerConnection for media');
    pc = new RTCPeerConnection({
      iceServers: [
        { urls: 'stun:stun.l.google.com:19302' },
        { urls: 'stun:stun1.l.google.com:19302' },
      ]
    });

    pc.ontrack = (event) => {
      console.log('Phone ontrack:', event.track.kind, event.streams.length);
      if (event.track.kind === 'video' && event.streams[0]) {
        log('Receiving camera feed');
        phoneCam.srcObject = event.streams[0];
        phoneCam.play().catch(() => {});
        remoteStatus.textContent = 'Camera active. Hold mic to talk.';
        retryCount = 0;
      }
    };

    pc.ondatachannel = (event) => {
      console.log('Phone got data channel from host');
      const channel = event.channel;
      channel.binaryType = 'arraybuffer';
      channel.onmessage = (e) => {
        if (e.data instanceof ArrayBuffer) {
          const int16 = new Int16Array(e.data);
          playAudioChunk(int16);
        }
      };
    };

    pc.onicecandidate = (event) => {
      if (event.candidate && dataChannel && dataChannel.readyState === 'open') {
        console.log('Phone sending ICE candidate');
        dataChannel.send(JSON.stringify({ type: 'ice-candidate', candidate: event.candidate }));
      }
    };

    pc.oniceconnectionstatechange = () => {
      console.log('Phone ICE state:', pc.iceConnectionState);
      remoteStatus.textContent = 'ICE: ' + pc.iceConnectionState;
    };

    pc.onnegotiationneeded = async () => {
      console.log('Phone negotiation needed, creating offer');
      try {
        const offer = await pc.createOffer();
        await pc.setLocalDescription(offer);
        dataChannel.send(JSON.stringify({ type: 'offer', sdp: offer }));
        remoteStatus.textContent = 'Sent offer, waiting for answer...';
      } catch (e) {
        console.error('Phone create offer failed:', e);
      }
    };

    dataChannel.onmessage = (event) => {
      let msg;
      try {
        msg = typeof event.data === 'string' ? JSON.parse(event.data) : null;
      } catch (e) {
        msg = null;
      }

      if (msg && msg.type === 'answer' && pc) {
        console.log('Phone got answer');
        pc.setRemoteDescription(new RTCSessionDescription(msg.sdp)).catch(e => console.error('Set remote failed:', e));
      } else if (msg && msg.type === 'ice-candidate' && pc) {
        console.log('Phone got ICE candidate');
        pc.addIceCandidate(new RTCIceCandidate(msg.candidate)).catch(e => {});
      } else if (msg && msg.type === 'offer' && pc) {
        console.log('Phone got offer, creating answer');
        pc.setRemoteDescription(new RTCSessionDescription(msg.sdp)).then(() => {
          return pc.createAnswer();
        }).then(answer => {
          return pc.setLocalDescription(answer);
        }).then(() => {
          dataChannel.send(JSON.stringify({ type: 'answer', sdp: pc.localDescription }));
          remoteStatus.textContent = 'Sent answer, waiting for ICE...';
        }).catch(e => console.error('Phone answer failed:', e));
      } else if (event.data instanceof ArrayBuffer) {
        const int16 = new Int16Array(event.data);
        playAudioChunk(int16);
      }
    };
  }

  function init() {
    peer = new Peer(null, {
      host: '0.peerjs.com',
      port: 443,
      path: '/',
      secure: true,
      config: {
        iceServers: [
          { urls: 'stun:stun.l.google.com:19302' },
          { urls: 'stun:stun1.l.google.com:19302' },
        ]
      }
    });

    peer.on('open', (id) => {
      log('Phone peer ID: ' + id);
      log('Connecting to host: ' + hostPeerId);
      remoteStatus.textContent = 'Phone ready. Connecting to ' + hostPeerId + '...';
      remoteStatus.style.color = '#eba53c';
      connectToHost();
    });

    peer.on('error', (err) => {
      console.error('Peer error:', err);
      if (err.type === 'peer-unavailable' && retryCount < MAX_RETRIES) {
        retryCount++;
        log('Laptop not found, retrying...');
        scheduleRetry(connectToHost, 0);
      } else {
        remoteStatus.textContent = 'Signaling error: ' + err.type;
      }
    });
  }

  async function startMic() {
    if (!dataChannel || dataChannel.readyState !== 'open') {
      alert('Not connected to laptop yet');
      return;
    }

    try {
      micStream = await navigator.mediaDevices.getUserMedia({
        audio: {
          echoCancellation: true,
          noiseSuppression: true,
          autoGainControl: true,
          sampleRate: 16000,
          channelCount: 1
        },
        video: false
      });

      audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      const source = audioCtx.createMediaStreamSource(micStream);
      scriptProcessor = audioCtx.createScriptProcessor(4096, 1, 1);

      scriptProcessor.onaudioprocess = (e) => {
        if (!dataChannel || dataChannel.readyState !== 'open') return;

        const input = e.inputBuffer.getChannelData(0);
        const int16 = new Int16Array(input.length);
        for (let i = 0; i < input.length; i++) {
          const s = Math.max(-1, Math.min(1, input[i]));
          int16[i] = s < 0 ? s * 0x8000 : s * 0x7FFF;
        }

        try {
          dataChannel.send(int16.buffer);
        } catch (err) {
          // Channel closed
        }
      };

      source.connect(scriptProcessor);

      micBtn.style.animation = 'pulse 1.2s infinite';
      remoteStatus.textContent = 'Talking...';

    } catch (e) {
      alert('Mic access denied: ' + e.message);
    }
  }

  function stopMic() {
    if (micStream) {
      micStream.getTracks().forEach(t => t.stop());
      micStream = null;
    }
    if (audioCtx) {
      audioCtx.close();
      audioCtx = null;
    }
    if (scriptProcessor) {
      scriptProcessor.disconnect();
      scriptProcessor = null;
    }
    micBtn.style.animation = '';
    remoteStatus.textContent = 'Connected to JARVIS';
    remoteStatus.style.color = '#eba53c';
  }

  const style = document.createElement('style');
  style.textContent = '@keyframes pulse { 0%,100% { box-shadow:0 0 20px rgba(235,165,60,0.4); } 50% { box-shadow:0 0 40px rgba(235,165,60,0.7); } }';
  document.head.appendChild(style);

  micBtn.addEventListener('mousedown', startMic);
  micBtn.addEventListener('mouseup', stopMic);
  micBtn.addEventListener('mouseleave', stopMic);
  micBtn.addEventListener('touchstart', (e) => { e.preventDefault(); startMic(); });
  micBtn.addEventListener('touchend', (e) => { e.preventDefault(); stopMic(); });

  init();
})();
</script>
</body>
</html>
