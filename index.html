```html
<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>RoomSwitch Control</title>

<style>

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  min-height: 100vh;

  background: #080808;
  color: white;

  font-family: Arial, sans-serif;

  display: flex;
  justify-content: center;
  align-items: center;
}

.container {

  width: 420px;
  max-width: 92%;

  background: #111;

  border: 1px solid #333;

  border-radius: 20px;

  padding: 30px;

  box-shadow:
    0 0 30px rgba(255,255,255,0.08);
}

h1 {

  margin-top: 0;

  text-align: center;

  font-size: 28px;
}

.subtitle {

  text-align: center;

  color: #999;

  margin-bottom: 30px;
}

label {

  display: block;

  margin-top: 18px;

  margin-bottom: 8px;

  color: #ccc;

  font-size: 14px;
}

input {

  width: 100%;

  padding: 14px;

  background: #080808;

  border: 1px solid #444;

  border-radius: 10px;

  color: white;

  font-size: 18px;

  outline: none;
}

input:focus {

  border-color: white;
}

button {

  width: 100%;

  padding: 15px;

  margin-top: 20px;

  border: none;

  border-radius: 10px;

  background: white;

  color: black;

  font-size: 17px;

  font-weight: bold;

  cursor: pointer;
}

button:hover {

  background: #ddd;
}

button:disabled {

  background: #444;

  color: #888;

  cursor: not-allowed;
}

.status {

  margin-top: 20px;

  padding: 12px;

  border-radius: 10px;

  background: #080808;

  text-align: center;

  color: #aaa;
}

.current {

  margin-top: 25px;

  padding: 15px;

  background: #0a0a0a;

  border-radius: 12px;

  border: 1px solid #292929;
}

.current-title {

  color: #888;

  font-size: 13px;

  margin-bottom: 10px;
}

.value {

  display: flex;

  justify-content: space-between;

  margin: 7px 0;

  color: #ddd;
}

.value span:last-child {

  color: white;

  font-weight: bold;
}

</style>

</head>

<body>

<div class="container">

  <h1>RoomSwitch</h1>

  <div class="subtitle">
    ESP32 Stepper Control
  </div>


  <button id="connectButton">
    Connect to ESP32
  </button>


  <label for="onAngle">
    ON Angle
  </label>

  <input
    id="onAngle"
    type="number"
    min="0"
    max="360"
    value="0"
  >


  <label for="offAngle">
    OFF Angle
  </label>

  <input
    id="offAngle"
    type="number"
    min="0"
    max="360"
    value="360"
  >


  <label for="times">
    360° Rotation Times
  </label>

  <input
    id="times"
    type="number"
    min="1"
    max="100"
    value="1"
  >


  <button
    id="saveButton"
    disabled
  >
    Save Settings
  </button>


  <div class="status" id="status">
    Not connected
  </div>


  <div class="current">

    <div class="current-title">
      SAVED SETTINGS
    </div>

    <div class="value">
      <span>ON</span>
      <span id="currentOn">---</span>
    </div>

    <div class="value">
      <span>OFF</span>
      <span id="currentOff">---</span>
    </div>

    <div class="value">
      <span>Times</span>
      <span id="currentTimes">---</span>
    </div>

  </div>

</div>


<script>

// ============================================================
// UUIDs
// ============================================================

const SERVICE_UUID =
  "4fafc201-1fb5-459e-8fcc-c5c9c331914b";

const ON_ANGLE_UUID =
  "beb5483e-36e1-4688-b7f5-ea07361b26a8";

const OFF_ANGLE_UUID =
  "d4e0e0e0-1a2b-4c3d-9e8f-7a6b5c4d3e2f";

const TIMES_UUID =
  "7a6b5c4d-3e2f-4a1b-8c9d-0e1f2a3b4c5d";


// ============================================================
// VARIABLES
// ============================================================

let device = null;

let server = null;

let service = null;

let onCharacteristic = null;

let offCharacteristic = null;

let timesCharacteristic = null;


// ============================================================
// ELEMENTS
// ============================================================

const connectButton =
  document.getElementById("connectButton");

const saveButton =
  document.getElementById("saveButton");

const status =
  document.getElementById("status");

const onInput =
  document.getElementById("onAngle");

const offInput =
  document.getElementById("offAngle");

const timesInput =
  document.getElementById("times");

const currentOn =
  document.getElementById("currentOn");

const currentOff =
  document.getElementById("currentOff");

const currentTimes =
  document.getElementById("currentTimes");


// ============================================================
// STATUS
// ============================================================

function setStatus(message) {

  status.textContent =
    message;
}


// ============================================================
// READ BLE VALUE
// ============================================================

async function readValue(characteristic) {

  const data =
    await characteristic.readValue();

  return new TextDecoder().decode(data);
}


// ============================================================
// LOAD CURRENT SETTINGS
// ============================================================

async function loadSettings() {

  try {

    const onValue =
      await readValue(
        onCharacteristic
      );

    const offValue =
      await readValue(
        offCharacteristic
      );

    const timesValue =
      await readValue(
        timesCharacteristic
      );


    onInput.value =
      parseInt(onValue);

    offInput.value =
      parseInt(offValue);

    timesInput.value =
      parseInt(timesValue);


    currentOn.textContent =
      onValue + "°";

    currentOff.textContent =
      offValue + "°";

    currentTimes.textContent =
      timesValue + "x";


    setStatus(
      "Connected"
    );

  }

  catch (error) {

    console.error(error);

    setStatus(
      "Connected, but could not read settings"
    );
  }
}


// ============================================================
// CONNECT
// ============================================================

connectButton.addEventListener(
  "click",
  async function() {

    try {

      setStatus(
        "Searching for ESP32..."
      );


      device =
        await navigator.bluetooth.requestDevice({

          filters: [
            {
              name: "RoomSwitch-ESP32"
            }
          ],

          optionalServices: [
            SERVICE_UUID
          ]
        });


      device.addEventListener(
        "gattserverdisconnected",
        function() {

          setStatus(
            "ESP32 disconnected"
          );

          saveButton.disabled =
            true;

          connectButton.disabled =
            false;
        }
      );


      setStatus(
        "Connecting..."
      );


      server =
        await device.gatt.connect();


      service =
        await server.getPrimaryService(
          SERVICE_UUID
        );


      onCharacteristic =
        await service.getCharacteristic(
          ON_ANGLE_UUID
        );


      offCharacteristic =
        await service.getCharacteristic(
          OFF_ANGLE_UUID
        );


      timesCharacteristic =
        await service.getCharacteristic(
          TIMES_UUID
        );


      await loadSettings();


      saveButton.disabled =
        false;

      connectButton.textContent =
        "Connected";

      connectButton.disabled =
        true;

    }

    catch (error) {

      console.error(error);

      setStatus(
        "Connection failed"
      );
    }

  }
);


// ============================================================
// SAVE SETTINGS
// ============================================================

saveButton.addEventListener(
  "click",
  async function() {

    try {

      let on =
        parseInt(onInput.value);

      let off =
        parseInt(offInput.value);

      let times =
        parseInt(timesInput.value);


      // Validate ON

      if (
        isNaN(on) ||
        on < 0 ||
        on > 360
      ) {

        alert(
          "ON angle must be between 0 and 360."
        );

        return;
      }


      // Validate OFF

      if (
        isNaN(off) ||
        off < 0 ||
        off > 360
      ) {

        alert(
          "OFF angle must be between 0 and 360."
        );

        return;
      }


      // Validate times

      if (
        isNaN(times) ||
        times < 1 ||
        times > 100
      ) {

        alert(
          "Times must be between 1 and 100."
        );

        return;
      }


      setStatus(
        "Saving..."
      );


      const encoder =
        new TextEncoder();


      // Save ON

      await onCharacteristic.writeValue(
        encoder.encode(
          String(on)
        )
      );


      // Save OFF

      await offCharacteristic.writeValue(
        encoder.encode(
          String(off)
        )
      );


      // Save TIMES

      await timesCharacteristic.writeValue(
        encoder.encode(
          String(times)
        )
      );


      // Update display

      currentOn.textContent =
        on + "°";

      currentOff.textContent =
        off + "°";

      currentTimes.textContent =
        times + "x";


      setStatus(
        "Settings saved to ESP32"
      );

    }

    catch (error) {

      console.error(error);

      setStatus(
        "Could not save settings"
      );
    }

  }
);


// ============================================================
// CHECK WEB BLUETOOTH
// ============================================================

if (!navigator.bluetooth) {

  setStatus(
    "Web Bluetooth is not supported in this browser"
  );

  connectButton.disabled =
    true;
}

</script>

</body>
</html>
