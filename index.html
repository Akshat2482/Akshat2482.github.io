<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>JARVIS Remote</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body {
    height:100%; width:100%; overflow:hidden;
    background:#0a0a0c; color:#ebebf0;
    font-family:-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    touch-action:manipulation; user-select:none;
  }
  #app {
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    height:100vh; width:100vw; padding:20px; gap:16px;
  }
  .preview {
    width:100%; max-width:640px; aspect-ratio:4/3; border-radius:14px;
    background:#141416; border:1.5px solid #2a2a30; overflow:hidden; position:relative;
  }
  .preview video {
    width:100%; height:100%; object-fit:contain; display:block;
  }
  .preview .label {
    position:absolute; top:10px; left:10px;
    background:rgba(0,0,0,0.6); color:#eba53c;
    padding:4px 10px; border-radius:6px; font-size:11px; font-weight:600;
  }
  .btn {
    padding:14px 28px; border-radius:12px; border:none;
    background:linear-gradient(180deg,#eba53c,#c7852a); color:#0a0a0c;
    font-size:14px; font-weight:700; cursor:pointer;
    display:flex; align-items:center; gap:8px;
  }
  .btn:active { transform:scale(0.96); }
  .btn:disabled { opacity:0.5; cursor:not-allowed; }
  .status {
    font-size:13px; color:#6b6b76; text-align:center; max-width:500px;
  }
</style>
</head>
<body>
<div id="app">
  <div class="preview">
    <video id="phoneCam" autoplay playsinline></video>
    <div class="label" id="statusLabel">Waiting for laptop...</div>
  </div>

  <button class="btn" id="micBtn">
    <span>🎤</span> Hold to Talk
  </button>

  <div class="status" id="remoteStatus">
    Connect to JARVIS to receive camera and send audio.
  </div>
</div>

<script>
(function() {
  // Read signaling server URL from query param, fallback to localhost
  const params = new URLSearchParams(window.location.search);
  const signalParam = params.get('signal');
  const WS_URL = signalParam || 'ws://YOUR_LAPTOP_IP:18926/signal';

  let ws = null;
  let pc = null;
  let dataChannel = null;
  let micStream = null;
  let audioCtx = null;
  let scriptProcessor = null;

  const phoneCam = document.getElementById('phoneCam');
  const statusLabel = document.getElementById('statusLabel');
  const remoteStatus = document.getElementById('remoteStatus');
  const micBtn = document.getElementById('micBtn');

  function log(msg) {
    console.log('[JARVIS Remote]', msg);
    statusLabel.textContent = msg;
  }

  function connectWS() {
    ws = new WebSocket(WS_URL);

    ws.onopen = () => {
      remoteStatus.textContent = 'Connected to JARVIS';
      remoteStatus.style.color = '#eba53c';
      ws.send(JSON.stringify({ client: 'phone' }));
      createPeerConnection();
    };

    ws.onerror = () => {
      remoteStatus.textContent = 'Connection failed';
      remoteStatus.style.color = '#ff6b6b';
    };

    ws.onclose = () => {
      remoteStatus.textContent = 'Disconnected from JARVIS';
      remoteStatus.style.color = '#6b6b76';
    };

    ws.onmessage = async (event) => {
      try {
        const data = JSON.parse(event.data);
        if (!pc) return;

        if (data.type === 'offer') {
          log('Receiving camera from laptop...');
          await pc.setRemoteDescription(new RTCSessionDescription(data.sdp));
          const answer = await pc.createAnswer();
          await pc.setLocalDescription(answer);
          ws.send(JSON.stringify({ type: 'answer', sdp: answer }));
        } else if (data.type === 'answer') {
          await pc.setRemoteDescription(new RTCSessionDescription(data.sdp));
        } else if (data.type === 'ice-candidate') {
          try {
            await pc.addIceCandidate(new RTCIceCandidate(data.candidate));
          } catch (e) {}
        }
      } catch (e) {
        console.error('Signaling error:', e);
      }
    };
  }

  function createPeerConnection() {
    pc = new RTCPeerConnection({
      iceServers: [
        { urls: 'stun:stun.l.google.com:19302' },
        { urls: 'stun:stun1.l.google.com:19302' },
      ]
    });

    // Receive video from laptop camera
    pc.ontrack = (event) => {
      if (event.track.kind === 'video') {
        log('Camera feed received');
        phoneCam.srcObject = event.streams[0];
      }
    };

    // Data channel for sending audio back to laptop
    pc.ondatachannel = (event) => {
      dataChannel = event.channel;
      dataChannel.binaryType = 'arraybuffer';
    };

    pc.onicecandidate = (event) => {
      if (event.candidate && ws && ws.readyState === WebSocket.OPEN) {
        ws.send(JSON.stringify({ type: 'ice-candidate', candidate: event.candidate }));
      }
    };

    pc.oniceconnectionstatechange = () => {
      remoteStatus.textContent = 'ICE: ' + pc.iceConnectionState;
    };
  }

  async function startMic() {
    if (!pc || !dataChannel || dataChannel.readyState !== 'open') {
      alert('Not connected to laptop yet. Wait for ICE to connect.');
      return;
    }

    try {
      micStream = await navigator.mediaDevices.getUserMedia({
        audio: {
          echoCancellation: true,
          noiseSuppression: true,
          autoGainControl: true,
          sampleRate: 16000,
          channelCount: 1
        },
        video: false
      });

      audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      const source = audioCtx.createMediaStreamSource(micStream);
      scriptProcessor = audioCtx.createScriptProcessor(4096, 1, 1);

      scriptProcessor.onaudioprocess = (e) => {
        if (!dataChannel || dataChannel.readyState !== 'open') return;

        const input = e.inputBuffer.getChannelData(0);
        const int16 = new Int16Array(input.length);
        for (let i = 0; i < input.length; i++) {
          const s = Math.max(-1, Math(1, input[i]));
          int16[i] = s < 0 ? s * 0x8000 : s * 0x7FFF;
        }

        try {
          dataChannel.send(int16.buffer);
        } catch (e) {
          // Channel closed
        }
      };

      source.connect(scriptProcessor);
      scriptProcessor.connect(audioCtx.destination);

      micBtn.style.animation = 'pulse 1.2s infinite';
      remoteStatus.textContent = 'Talking...';

    } catch (e) {
      alert('Mic access denied: ' + e.message);
    }
  }

  function stopMic() {
    if (micStream) {
      micStream.getTracks().forEach(t => t.stop());
      micStream = null;
    }
    if (audioCtx) {
      audioCtx.close();
      audioCtx = null;
    }
    if (scriptProcessor) {
      scriptProcessor.disconnect();
      scriptProcessor = null;
    }
    micBtn.style.animation = '';
    remoteStatus.textContent = 'Connected to JARVIS';
    remoteStatus.style.color = '#eba53c';
  }

  // Pulse animation
  const style = document.createElement('style');
  style.textContent = '@keyframes pulse { 0%,100% { box-shadow:0 0 20px rgba(235,165,60,0.4); } 50% { box-shadow:0 0 40px rgba(235,165,60,0.7); } }';
  document.head.appendChild(style);

  // Mic button events
  micBtn.addEventListener('mousedown', startMic);
  micBtn.addEventListener('mouseup', stopMic);
  micBtn.addEventListener('mouseleave', stopMic);
  micBtn.addEventListener('touchstart', (e) => { e.preventDefault(); startMic(); });
  micBtn.addEventListener('touchend', (e) => { e.preventDefault(); stopMic(); });

  // Auto-connect on load
  connectWS();
})();
</script>
</body>
</html>
